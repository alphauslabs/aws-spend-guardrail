  # Role AWS Budgets assumes to attach a freeze policy.
  BudgetsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: attach-freeze-policies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [organizations:AttachPolicy, organizations:DetachPolicy]
                Resource:
                  - !GetAtt FreezePolicyA.Arn
                  - !GetAtt FreezePolicyB.Arn
                  - !Sub arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*
                  - !Sub arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*

  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      # Usage counters set "expires" so they are dropped after about 40 days.
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: aws-spend-guardrail alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Budget notifications and budget action notifications go here.
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: aws-spend-guardrail budget notifications

  NotifyTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NotifyTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref NotifyTopic
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  OutboxDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Events wait here until Jennah accepts them. With a 5-minute visibility
  # timeout, 1000 receives is about 3.5 days of retries, well inside the
  # 14-day retention, so an undeliverable event reaches the dead-letter queue
  # rather than expiring.
  OutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutboxDeadLetterQueue.Arn
        maxReceiveCount: 1000

  OutboxDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: aws-spend-guardrail events could not be delivered to Jennah and are in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt OutboxDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GuardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/guardrail-${MSPId}
      RetentionInDays: 365

  GuardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: guard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${GuardLogGroup.Arn}:*
              - Sid: ListBudgets
                Effect: Allow
                Action: [budgets:ViewBudget, budgets:DescribeBudgetActionsForAccount]
                Resource: "*"
              - Sid: ManageOwnedBudgets
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:ListTagsForResource
                  - budgets:TagResource
                  - budgets:CreateBudgetAction
                  - budgets:UpdateBudgetAction
                  - budgets:DeleteBudgetAction
                  - budgets:DescribeBudgetAction
                  - budgets:DescribeBudgetActionsForBudget
                  - budgets:ExecuteBudgetAction
                Resource:
                  - !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/guardrail-*
                  - !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/guardrail-*/action/*
              - Sid: PassBudgetsRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BudgetsExecutionRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: budgets.amazonaws.com }
              - Sid: ReadOrganization
                Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:ListAccountsForParent
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListParents
                  - organizations:ListTargetsForPolicy
                Resource: "*"
              - Sid: ReadCostExplorer
                Effect: Allow
                Action: ce:GetCostAndUsage
                Resource: "*"
              - Sid: AttachDetachFreezePolicies
                Effect: Allow
                Action: [organizations:AttachPolicy, organizations:DetachPolicy]
                Resource:
                  - !GetAtt FreezePolicyA.Arn
                  - !GetAtt FreezePolicyB.Arn
                  - !Sub arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*
                  - !Sub arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*
              - Sid: State
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt StateTable.Arn
              - Sid: Outbox
                Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt OutboxQueue.Arn
              - Sid: Alerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: AlertRecipients
                Effect: Allow
                # Keeps the alert topic's email subscriptions in line with
                # the config's alert_emails. This topic only.
                Action: [sns:Subscribe, sns:ListSubscriptionsByTopic]
                Resource: !Ref AlertTopic
              - Sid: AlertRecipientsRemove
                Effect: Allow
                # AWS authorizes Unsubscribe against the topic's ARN, not the
                # subscription's, so ${AlertTopic}:* is refused. This reaches
                # the same subscriptions; the guard never removes AlertEmail.
                Action: sns:Unsubscribe
                Resource: !Ref AlertTopic
              - Sid: Credentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref ReaderSecretArn, !Ref WriterSecretArn]
              - Sid: ReadOwnCodeHash
                Effect: Allow
                Action: lambda:GetFunction
                # Only the guard itself, so it can report its deployed package hash.
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:guardrail-${MSPId}

  # The AI guard's extra permissions: read the organization trail, decrypt it
  # when it is encrypted, and attach or detach the AI cutoff policy, on
  # accounts only.
  AIGuardPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: AIGuard
    Metadata:
      cfn-lint:
        config:
          # cfn-lint resolves TrailBucket to its empty default, which isn't a
          # valid ARN; that never happens, since this resource only exists with
          # the AI guard on, and the AIGuardNeedsTrail rule then requires it.
          ignore_checks: [W1031]
    Properties:
      RoleName: !Ref GuardRole
      PolicyName: ai-guard
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListTrail
            Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !Sub arn:${AWS::Partition}:s3:::${TrailBucket}
          - Sid: ReadTrail
            Effect: Allow
            Action: s3:GetObject
            Resource: !If
              - HasTrailPrefix
              - !Sub arn:${AWS::Partition}:s3:::${TrailBucket}/${TrailPrefix}/AWSLogs/*
              - !Sub arn:${AWS::Partition}:s3:::${TrailBucket}/AWSLogs/*
          - Sid: ReadOrganizationId
            Effect: Allow
            Action: organizations:DescribeOrganization
            Resource: "*"
          - Sid: AICutoff
            Effect: Allow
            Action: [organizations:AttachPolicy, organizations:DetachPolicy]
            Resource:
              - !GetAtt AIDenyPolicy.Arn
              - !Sub arn:${AWS::Partition}:organizations::${AWS::AccountId}:account/o-*/*
          - !If
            - AIGuardKms
            - Sid: DecryptTrail
              Effect: Allow
              Action: kms:Decrypt
              Resource: !Ref TrailKmsKeyArn
              Condition:
                StringLike: { kms:ViaService: s3.*.amazonaws.com }
            - !Ref AWS::NoValue

  TrailSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: AIGuard
    Properties:
      Description: Read new organization trail files for the AI guard.
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt GuardFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"task":"trail"}'

  GuardFunction:
    Type: AWS::Lambda::Function
    DependsOn: GuardLogGroup
    Properties:
      FunctionName: !Sub guardrail-${MSPId}
      Description: aws-spend-guardrail guard
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Code:
        S3Bucket: !Ref FunctionPackageBucket
        S3Key: !Ref FunctionPackageKey
      Role: !GetAtt GuardRole.Arn
      MemorySize: 256
      Timeout: 120
      # One invocation at a time: a pull, a notification, and an outbox batch
      # never run concurrently against the same state.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          PAYER_ACCOUNT_ID: !Ref AWS::AccountId
          MSP_ID: !Ref MSPId
          JENNAH_ENDPOINT: !Ref JennahEndpoint
          READER_SECRET_ARN: !Ref ReaderSecretArn
          WRITER_SECRET_ARN: !Ref WriterSecretArn
          FREEZE_POLICY_A: !GetAtt FreezePolicyA.Id
          FREEZE_POLICY_B: !GetAtt FreezePolicyB.Id
          BUDGETS_EXECUTION_ROLE_ARN: !GetAtt BudgetsExecutionRole.Arn
          NOTIFY_TOPIC_ARN: !Ref NotifyTopic
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ALERT_EMAIL: !Ref AlertEmail
          AI_POLICY_ID: !If [AIGuard, !GetAtt AIDenyPolicy.Id, ""]
          TRAIL_BUCKET: !If [AIGuard, !Ref TrailBucket, ""]
          TRAIL_PREFIX: !Ref TrailPrefix
          OUTBOX_QUEUE_URL: !Ref OutboxQueue
          STATE_TABLE: !Ref StateTable
          LOOSENING_APPROVERS: !Join [",", !Ref LooseningApprovers]
          LOOSENING_REQUIRED_APPROVALS: !Ref LooseningRequiredApprovals
          LOOSENING_APPROVAL_WINDOW: !Ref LooseningApprovalWindow
          LOOSENING_DELAY: !Ref LooseningDelay
          GUARD_VERSION: !Ref GuardVersion

  NotifySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: lambda
      Endpoint: !GetAtt GuardFunction.Arn

  NotifyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GuardFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref NotifyTopic

  OutboxEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref GuardFunction
      EventSourceArn: !GetAtt OutboxQueue.Arn
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-guard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GuardFunction.Arn

  PullSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Pull config from Jennah and reconcile budgets.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt GuardFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"task":"pull"}'

  # Optional: run the coverage check when an account is created, invited,
  # or moved, instead of waiting for the daily run.
  AccountEventsRule:
    Type: AWS::Events::Rule
    Condition: ReactToAccounts
    Properties:
      Description: Run the guardrail coverage check when the organization's accounts change.
      EventPattern:
        source: [aws.organizations]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [organizations.amazonaws.com]
          eventName:
            - CreateAccount
            - InviteAccountToOrganization
            - AcceptHandshake
            - MoveAccount
      Targets:
        - Id: guard
          Arn: !GetAtt GuardFunction.Arn

  AccountEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ReactToAccounts
    Properties:
      FunctionName: !Ref GuardFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AccountEventsRule.Arn

  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Period-start lifts, drift check, OU membership, account coverage, and heartbeat.
      ScheduleExpression: cron(15 0 * * ? *)
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !GetAtt GuardFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"task":"daily"}'

  # On stack deletion, lifts every freeze the guard recorded and removes the
  # budgets it owns, before the function and policies go.
  Teardown:
    Type: Custom::GuardrailTeardown
    DependsOn: [GuardRole, BudgetsExecutionRole, StateTable, OutboxQueue, AlertTopic]
    Properties:
      ServiceToken: !GetAtt GuardFunction.Arn
      # References, not DependsOn, so these exist only with the AI guard on:
      # the teardown runs (and detaches AI cutoffs) before they are deleted.
      AIPolicy: !If [AIGuard, !Ref AIDenyPolicy, ""]
      AIPermissions: !If [AIGuard, !Ref AIGuardPolicy, ""]

Outputs:
  GuardFunctionName:
    Value: !Ref GuardFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  FreezePolicyAId:
    Value: !GetAtt FreezePolicyA.Id
  FreezePolicyBId:
    Value: !GetAtt FreezePolicyB.Id
  OutboxDeadLetterQueueUrl:
    Value: !Ref OutboxDeadLetterQueue
