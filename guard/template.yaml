AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-spend-guardrail guard for one payer (management) account. Freezes new spend
  in an account or OU when its AWS Budgets ceiling is reached. Config, loosening
  approvals, and the record of every freeze live in Jennah.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Jennah }
        Parameters: [MSPId, ExpectedPayerAccountId, JennahEndpoint, ReaderSecretArn, WriterSecretArn]
      - Label: { default: Loosening approvals (kept here so a Jennah credential cannot change them) }
        Parameters: [LooseningApprovers, LooseningRequiredApprovals, LooseningApprovalWindow, LooseningDelay]
      - Label: { default: Function package }
        Parameters: [FunctionPackageBucket, FunctionPackageKey, GuardVersion]
      - Label: { default: Local alerts }
        Parameters: [AlertEmail]
      - Label: { default: Account coverage }
        Parameters: [ReactToAccountEvents]
      - Label: { default: AI guard (optional) }
        Parameters: [EnableAIGuard, TrailBucket, TrailPrefix, TrailKmsKeyArn]

Parameters:
  MSPId:
    Type: String
    Description: MSP id. With this payer account it names the Jennah datasets guardrail.<id>.<payer>.config and .inbox. One MSP may have several payer orgs, each with its own stack.
    AllowedPattern: "^[a-z0-9]([a-z0-9_-]{0,88}[a-z0-9])?$"
  ExpectedPayerAccountId:
    Type: String
    Default: ""
    AllowedPattern: "^([0-9]{12})?$"
    Description: Optional. When set, the stack can only be created in this account, so an install link made for one payer org can't install the guard in another. Install links always set it.
  JennahEndpoint:
    Type: String
    Default: ""
    Description: Jennah gRPC endpoint as host:port. Leave empty for Jennah's public endpoint (the SDK default).
  ReaderSecretArn:
    Type: String
    Description: Secrets Manager secret holding the reader API key (read config; create, read, and cancel approvals).
  WriterSecretArn:
    Type: String
    Description: Secrets Manager secret holding the writer API key (write the inbox only).
  LooseningApprovers:
    Type: CommaDelimitedList
    Description: Emails asked to approve a loosening. Each must be a member of the Jennah enterprise or on its approver allowlist.
  LooseningRequiredApprovals:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Approvals needed. 1 for any one approver, or the number of LooseningApprovers to require all of them. No other value works.
  LooseningApprovalWindow:
    Type: String
    Default: 24h
    AllowedPattern: "^[0-9]+(h|m)$"
    Description: How long approvers have to answer. Unanswered means the loosening is not applied.
  LooseningDelay:
    Type: String
    Default: 30m
    AllowedPattern: "^[0-9]+(h|m)$"
    Description: Minimum time between the guard first seeing a loosening version and applying it, even when approved sooner.
  FunctionPackageBucket:
    Type: String
    Description: S3 bucket (in us-east-1) holding the guard function zip.
  FunctionPackageKey:
    Type: String
    Description: S3 key of the guard function zip.
  GuardVersion:
    Type: String
    Default: dev
    Description: Release version of the function package, recorded with every event.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to local alerts. Alerts never depend on Jennah.
  ReactToAccountEvents:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, an account created, invited, or moved in the organization runs the coverage check within minutes instead of at the next daily run. Only works when a CloudTrail trail records the account's management events; without one, these events never reach EventBridge.
  EnableAIGuard:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, the guard reads the organization CloudTrail trail every minute, prices Bedrock calls, and can cut off an account's AI access with the AI deny policy. Needs a multi-region organization trail logging management events.
  TrailBucket:
    Type: String
    Default: ""
    AllowedPattern: "^([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$"
    Description: S3 bucket the organization trail writes to. Required when EnableAIGuard is true. If it is in another account, its bucket policy must grant this stack's guard role read access (see docs/ai-guard.md).
  TrailPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^([A-Za-z0-9!_.*'()/-]*[^/])?$"
    Description: The trail's S3 key prefix, if it has one, without a trailing slash.
  TrailKmsKeyArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[A-Za-z0-9-]+)?$"
    Description: KMS key the trail encrypts its files with, if any. A key in another account must also allow this stack's guard role to decrypt (see docs/ai-guard.md).

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Deploy in us-east-1. AWS Budgets is served from there.
  RightAccount:
    RuleCondition: !Not [!Equals [!Ref ExpectedPayerAccountId, ""]]
    Assertions:
      - Assert: !Equals [!Ref ExpectedPayerAccountId, !Ref AWS::AccountId]
        AssertDescription: This install is for another payer account. Sign in to the payer account named in ExpectedPayerAccountId.
  AIGuardNeedsTrail:
    RuleCondition: !Equals [!Ref EnableAIGuard, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref TrailBucket, ""]]
        AssertDescription: The AI guard reads the organization trail. Set TrailBucket to the bucket it writes to.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  ReactToAccounts: !Equals [!Ref ReactToAccountEvents, "true"]
  AIGuard: !Equals [!Ref EnableAIGuard, "true"]
  AIGuardKms: !And [!Condition AIGuard, !Not [!Equals [!Ref TrailKmsKeyArn, ""]]]
  HasTrailPrefix: !Not [!Equals [!Ref TrailPrefix, ""]]

Resources:
  # The AI pack's cutoff, created unattached. The guard attaches it to an
  # account that passes an AI cap or trips an AI rule. It denies AI access
  # only: Bedrock model invocation (which also governs Converse), Bedrock API
  # keys, and AgentCore invoke and session actions.
  AIDenyPolicy:
    Type: AWS::Organizations::Policy
    Condition: AIGuard
    Properties:
      Name: !Sub guardrail-ai-cutoff-${MSPId}
      Description: aws-spend-guardrail AI cutoff. Attached by the guard; lifted through an approved config change.
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: GuardrailAICutoff
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:CallWithBearerToken
              - bedrock-agentcore:Invoke*
              - bedrock-agentcore:Start*
            Resource: "*"

  # Freeze policies, created unattached. Budgets attaches one when a scope's
  # threshold is reached.
  FreezePolicyA:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub guardrail-freeze-a-${MSPId}
      Description: aws-spend-guardrail freeze style A. Denies actions that create cost.
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: GuardrailFreezeA
            Effect: Deny
            Resource: "*"
            Action:
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:RequestSpotInstances
              - ec2:RequestSpotFleet
              - ec2:CreateFleet
              - ec2:RunScheduledInstances
              - ec2:CreateCapacityReservation
              - ec2:AllocateHosts
              - ec2:PurchaseReservedInstancesOffering
              - ec2:PurchaseHostReservation
              - ec2:CreateNatGateway
              - ec2:AllocateAddress
              - ec2:CreateVolume
              - ec2:CreateTransitGateway
              - ec2:CreateVpnConnection
              - ec2:CreateVpcEndpoint
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              - elasticloadbalancing:CreateLoadBalancer
              - ecs:CreateService
              - ecs:RunTask
              - ecs:StartTask
              - eks:CreateCluster
              - eks:CreateNodegroup
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - rds:StartDBInstance
              - rds:StartDBCluster
              - rds:RestoreDBInstanceFromDBSnapshot
              - rds:RestoreDBClusterFromSnapshot
              - rds:PurchaseReservedDBInstancesOffering
              - redshift:CreateCluster
              - redshift:ResumeCluster
              - elasticache:CreateCacheCluster
              - elasticache:CreateReplicationGroup
              - es:CreateDomain
              - dynamodb:CreateTable
              - kinesis:CreateStream
              - kafka:CreateCluster
              - elasticfilesystem:CreateFileSystem
              - fsx:CreateFileSystem
              - elasticmapreduce:RunJobFlow
              - glue:StartJobRun
              - sagemaker:CreateEndpoint
              - sagemaker:CreateNotebookInstance
              - sagemaker:StartNotebookInstance
              - sagemaker:CreateTrainingJob
              - sagemaker:CreateProcessingJob
              - sagemaker:CreateTransformJob
              - sagemaker:CreateHyperParameterTuningJob
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:CreateProvisionedModelThroughput
              - bedrock:CreateModelCustomizationJob
              - lightsail:CreateInstances
              - workspaces:CreateWorkspaces
              - gamelift:CreateFleet
              - globalaccelerator:CreateAccelerator
              - directconnect:CreateConnection
              - route53domains:RegisterDomain
              - savingsplans:CreateSavingsPlan
              - aws-marketplace:Subscribe

  FreezePolicyB:
    Type: AWS::Organizations::Policy
    Properties:
      Name: !Sub guardrail-freeze-b-${MSPId}
      Description: aws-spend-guardrail freeze style B. Denies everything except reads and cleanup of common services, and support, billing, cost, and security tooling.
      Type: SERVICE_CONTROL_POLICY
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: GuardrailFreezeB
            Effect: Deny
            Resource: "*"
            # SCPs reject a wildcard in the service part of an action (*:Describe*),
            # so reads and cleanup are listed per service. Anything not listed,
            # including any read of an unlisted service, is denied while frozen.
            NotAction:
              - "ec2:Describe*"
              - "ec2:Get*"
              - "ec2:List*"
              - "ec2:Stop*"
              - "ec2:Terminate*"
              - "ec2:Delete*"
